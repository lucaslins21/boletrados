# Banco de perguntas da curadoria do Boletrados.
#
# Importado a cada deploy por `bin/rails content:import` (app/services/curated_import.rb):
# só ADICIONA perguntas novas (pelo `ref`); perguntas já importadas não são alteradas. Para corrigir
# uma pergunta que já está no jogo, edite pelo painel /admin.
#
# Formato:
#   ref          identificador único e estável (nunca reutilize um ref)
#   categorias   1 a 3 slugs: brasileiro, europeu, sulamericano, selecoes, escudos, estadios
#   dificuldade  facil | medio | dificil (ponto de partida; o jogo recalibra pelo desempenho real)
#   pergunta     até 180 caracteres          correta / erradas  alternativas de até 60 caracteres
#   explicacao   até 500 caracteres          fonte    link para conferir (opcional)
#   imagem       arquivo em db/curated/<pasta>/ (escudos/, estadios/, jogadores/; PNG/JPEG/WebP até 512 KB);
#                escudos com o nome do clube apagado, fotos sem o nome à vista
#   credito      autor e licença da foto (Wikimedia Commons), acrescentado à explicação
#
# Categorias (docs/PRODUCT.md §3): brasileiro = só competições e clubes nacionais (Brasileirão, Copa do Brasil,
# estaduais, regionais); Seleção Brasileira vai em selecoes, Libertadores/Sul-Americana/Mundial em sulamericano.
# Escudos = o escudo em si (símbolos, cores, mudanças); nome antigo ou apelido de clube não é escudo.
#
# A alternativa correta vem escrita primeiro; a posição dela no jogo é sorteada de forma fixa pelo ref.
# Fatos conferidos em novembro de 2026.

