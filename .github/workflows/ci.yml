name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api_scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Brakeman (análise estática de segurança)
        run: bin/brakeman --no-pager
      - name: bundler-audit (gems com vulnerabilidades conhecidas)
        run: bin/bundler-audit

  api_lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - run: bin/rubocop -f github

  api_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boletrados
          POSTGRES_PASSWORD: boletrados
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U boletrados"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://boletrados:boletrados@localhost:5432
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bundle exec rspec
